<!DOCTYPE html>
<html lang="en"></html>

<head>
   <link rel="stylesheet" href="style.css">
    <script src="lib/decimal.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script type="module" src="app.js"></script>
</head>

<body>

    <div class="calculator">
        <div id="top-bezel">calc82</div>
        <div id="display">
            <div id="input-display"></div>
            <div id="output-display"></div>
        </div>
        <div id="buttons-container"></div>
    </div>
    
    <div class="calculator-old">
        <input id="test-input"><button id="calculate-button">EXE</button>
        <div id="text-display">=</div>
        <br>
        <button id="standard-decimal-button">S<->D</button>
        <span id="angle-mode-selector" class="angle-mode">
            <legend>Angle mode</legend>
            <input name="angle-mode" id="degrees-button" type="radio" value="deg">
            <label for="degrees-button">Degrees</label>

            <input name="angle-mode" id="radians-button" type="radio" value="rad" checked>
            <label for="radians-button">Radians</label>

            <input name="angle-mode" id="gradians-button" type="radio" value="gra">
            <label for="gradians-button">Gradians</label>
        </span>
    </div>

    <div class="debug">
        <pre><code>
            <div id="tokens">Token visualisation</div>
        </code></pre>
        <pre><code>
            <div id="ast">AST visualisation</div>
        </code></pre>
    </div>
</body>
