<!DOCTYPE html>
<html lang="en"></html>

<head>
    <meta charset="UTF-8">

   <link rel="stylesheet" href="style.css">
    <script src="lib/decimal.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script type="module" src="app.js"></script>
</head>

<body>
    <div class="calculator">
        <div id="top-bezel">calc82</div>
        <div id="screen">
            <div id="status-bar">
                <span id="shift-indicator" class="status status-boxed">S</span>
                <span id="alpha-indicator" class="status status-boxed">A</span>
                <span id="memory-indicator" class="status">M</span>
                <span id="store-indicator" class="status">STO</span>
                <span id="recall-indicator" class="status">RCL</span>
                <span id="stat-indicator" class="status">STAT</span>
                <span id="deg-indicator" class="status status-boxed">D</span>
                <span id="rad-indicator" class="status status-boxed">R</span>
                <span id="gra-indicator" class="status status-boxed">G</span>
                <span id="fix-indicator" class="status">Fix</span>
                <span id="sci-indicator" class="status">Sci</span>
                <span id="math-indicator" class="status">Math</span>
                <span id="up-indicator" class="status">&#9650;</span>
                <span id="down-indicator" class="status">&#9660;</span>
                <span id="disp-indicator" class="status">Disp</span>
            </div>
            <div id="display">
                <div id="message-display">
                    <div class="message-display-line" id="message-display-line1"></div>
                    <div class="message-display-line" id="message-display-line2"></div>
                    <div class="message-display-line" id="message-display-line3"></div>
                    <div class="message-display-line" id="message-display-line4"></div>
                </div>
                <div id="input-display"></div>
                <div id="output-display"></div>
            </div>
        </div>
        <div id="buttons-area">
            <div id="buttons-container"></div>
            <div id="buttons-overlay"></div>
        </div>
    </div>
    <div class="menubar">
        <button class="menuitem"><img class="menuicon" src="assets/svg/help.svg" draggable="false"></img></button>
        <button class="menuitem"><img class="menuicon" src="assets/svg/gear.svg" draggable="false"></img></button>
        <button class="menuitem"><img class="menuicon" src="assets/svg/info.svg" draggable="false"></img></button>
        <button class="menuitem" id="theme-toggle"><img class="menuicon" src="assets/svg/moon.svg" draggable="false"></img></button>
        <button class="menuitem"><img class="menuicon" src="assets/svg/fullscreen.svg" draggable="false"></img></button>
    </div>
    <div class="debug" style="display:none;"> <!--TODO: make this toggleable-->
        <pre><code>
            <div id="tokens">Token visualisation</div>
        </code></pre>
        <pre><code>
            <div id="ast">AST visualisation</div>
        </code></pre>
    </div>
</body>
